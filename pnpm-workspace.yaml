packages:
  - 'packages/*'

# Supply-chain policy: only accept packages that have been published for >= 24 hours.
# Declared explicitly here so the repo does not depend on the environment's
# default, and so contributors know why dependencies are pinned tightly.
minimumReleaseAge: 1440

# esbuild needs to run postinstall to link the platform-specific binary.
allowBuilds:
  esbuild: true
